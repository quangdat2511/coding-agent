name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^[A-Z]+-[0-9]+ (feat|fix|docs|style|refactor|test|chore|perf|ci): .+$'

          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "PR title does not match the required format."
            echo "Expected format: <ticket> <type>: <short description>"
            echo "Example: CA-00 feat: set up code base"
            echo "Current title: $PR_TITLE"
            exit 1
          fi

          echo "PR title is valid: $PR_TITLE"
