name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-imports:
    name: Check runtime sibling imports
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Check leaf bundles for runtime sibling imports
        run: bun run check:runtime-imports

  quality:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Check formatting and lint rules
        run: bun run ci:check

      - name: Check import boundaries
        run: bun run check:import-boundaries

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Run tests
        run: bun run test

  # A macOS minute counts as ten against the Actions minutes of a private repository, so pull
  # requests skip this job. It runs on each push to main, and on a manual run of this workflow,
  # which can target a pull request's branch. GitHub reports a job that `if` skips as a success, so
  # the required "Test (macos-26)" check does not block a pull request. It is a job of its own
  # because a job-level `if` cannot read the matrix.
  test-macos:
    name: Test (macos-26)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Run tests
        run: bun run test

  build:
    name: Build
    needs: [quality, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Build workspace packages
        run: bun run build

  # The Harbor adapter is the repository's only Python project. Biome, the import boundary check
  # and `bun --filter` do not cover it, so this job is its only check (ADR 0005, Consequences).
  terminalbench-adapter:
    name: TerminalBench adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The tests parse the manifest that the `artifact` job builds and uploads.
    needs: [artifact]

    # Every step runs in the repository root, as ADR 0005 §7 runs Harbor jobs.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `uv run --project` installs the Python version in evaluation/terminalbench/.python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"

      - name: Download the built manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-manifest
          path: ${{ runner.temp }}/artifact

      # `--frozen` installs from uv.lock without comparing it with pyproject.toml, so this step is
      # what fails when the lock file is out of date.
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --project evaluation/terminalbench --check

      - name: Run the adapter tests
        env:
          CODING_AGENT_ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: >-
          uv run --project evaluation/terminalbench --frozen
          python -m unittest discover --start-directory evaluation/terminalbench/tests
          --top-level-directory evaluation/terminalbench --verbose

  artifact:
    name: Evaluation artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci --ignore-scripts

      # Refuses a dirty tree, builds both ADR 0005 §2 executables, and checks that the x64 one
      # prints the manifest's version and commit and ignores .env and bunfig.toml.
      - name: Build both executables and the manifest
        run: bun run build:artifact

      - name: Upload the manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-manifest
          path: dist/artifact/artifact-manifest.json
