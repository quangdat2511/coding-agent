name: Discord PR Review Relay

# pull_request_review runs with the pull request's code, so this workflow gets no secrets and no
# token permissions. It only hands the pull request number and the review ID to the Discord PR
# Post workflow, which runs from main and reads the review back from GitHub.
on:
  pull_request_review:
    types:
      - submitted

permissions: {}

# Each single comment and each reply in a review thread is a review of its own. A comment waits two
# minutes before it is relayed, and the next comment from the same reviewer on the same pull request
# cancels that wait, so a burst of comments becomes one Discord note. A cancelled run does not start
# the Discord PR Post workflow's job. Approvals and change requests get a group of their own, so
# they are relayed at once and no comment cancels them.
concurrency:
  group: ${{ format('discord-review-{0}-{1}-{2}', github.event.pull_request.number, github.event.review.user.login, github.event.review.state == 'commented' && 'comments' || github.event.review.id) }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay the review
    # The post script gives no note for a review by the author, such as a reply in a review thread,
    # or by a bot. Skipping them here saves the two-minute wait and the post job. About half of the
    # reviews in November 2026 were the author's replies. A run whose only job is skipped does not
    # conclude with success, so the Discord PR Post workflow does not start a job for it.
    if: >-
      github.event.review.user.login != github.event.pull_request.user.login &&
      github.event.review.user.type != 'Bot' &&
      !endsWith(github.event.review.user.login, '[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Wait for more comments
        if: github.event.review.state == 'commented'
        run: sleep 120

      - name: Keep the pull request number and review ID
        run: >-
          jq '{pull_request: {number: .pull_request.number}, review: {id: .review.id}}'
          "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/review.json"

      - name: Upload the review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-review-event
          path: ${{ runner.temp }}/review.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
