min_version: 2.1.10

pre-commit:
  parallel: false
  commands:
    check:
      glob: "**/*.{ts,tsx,js,json}"
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    import-alias:
      glob: "**/*.{ts,tsx}"
      run: |
        errors=0
        for f in {staged_files}; do
          if grep -qE 'from\s+"\.{1,2}/|from\s+'\''\.{1,2}/' "$f"; then
            echo "ERROR: $f - use #src/ imports instead of relative imports"
            errors=$((errors + 1))
          fi
          case "$f" in
            packages/tui/prototype/*) ;;
            *)
              if grep -qE '["'\'']@(tests|examples)?/' "$f"; then
                echo "ERROR: $f - use #src/, #tests/ or #examples/ instead of @/ aliases"
                errors=$((errors + 1))
              fi
              ;;
          esac
        done
        [ "$errors" -eq 0 ]
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: bun run typecheck
