min_version: 2.1.10

pre-commit:
  parallel: false
  commands:
    check:
      glob: "**/*.{ts,tsx,js,json}"
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    import-boundaries:
      glob: "**/*.{ts,tsx}"
      run: bun run check:import-boundaries {staged_files}
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: bun run typecheck
